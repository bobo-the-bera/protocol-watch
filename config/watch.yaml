version: 2

# Rendered metadata that changes with time but does not represent protocol content.
global_ignore_patterns:
  - '^Last updated .*$'
  - '^(today|yesterday|[0-9]+ (minute|hour|day|week|month|year)s? ago)$'
  - '^Was this page helpful\??$'
  - '^Yes No$'
  - '^Powered by.*$'

# Crawl whole documentation trees from their published sitemaps. Every discovered page is
# snapshotted; relevance filtering happens later, after the diff exists.
crawls:
  - protocol: hpl
    slug: hyperlend-docs
    sitemap: https://docs.hyperlend.finance/sitemap.xml
    include_prefixes: [https://docs.hyperlend.finance/]
    max_pages: 500
    tags: [hyperlend, docs]

  - protocol: hpl
    slug: hyperliquid-docs
    sitemap: https://hyperliquid.gitbook.io/hyperliquid-docs/sitemap.xml
    include_prefixes: [https://hyperliquid.gitbook.io/hyperliquid-docs/]
    max_pages: 500
    tags: [hyperliquid, docs, integration-surface]

  - protocol: near
    slug: intents-docs
    sitemap: https://docs.near-intents.org/sitemap.xml
    include_prefixes: [https://docs.near-intents.org/]
    max_pages: 500
    tags: [intents, docs, api]

  - protocol: near
    slug: rhea-guide
    sitemap: https://guide.rhea.finance/sitemap.xml
    include_prefixes: [https://guide.rhea.finance/]
    max_pages: 300
    tags: [rhea, intents, integration, docs]

# Direct targets are retained as safety-critical fallbacks even if a site's sitemap changes.
targets:
  - protocol: hpl
    slug: liquid-perpetual-positions
    url: https://docs.hyperlend.finance/hyperlend-1/liquid-perpetual-positions
    tags: [liquid-perps, collateral, erc4626]

  - protocol: hpl
    slug: uta-portfolio-margin
    url: https://docs.hyperlend.finance/hyperlend-1/uta-portfolio-margin
    tags: [uta, portfolio-margin, collateral]

  - protocol: hpl
    slug: hyperliquid-portfolio-margin
    url: https://hyperliquid.gitbook.io/hyperliquid-docs/trading/portfolio-margin
    tags: [hyperliquid, portfolio-margin, corewriter]

  - protocol: hpl
    slug: hyperliquid-account-abstraction-modes
    url: https://hyperliquid.gitbook.io/hyperliquid-docs/trading/account-abstraction-modes
    tags: [hyperliquid, unified-account, portfolio-margin]

  - protocol: near
    slug: near-home
    url: https://near.com/
    tags: [confidential, perps, frontend, frontend-bundles]
    ignore_patterns:
      - '^\$[0-9.,]+ all-time volume$'
      - '^[0-9]+ supported assets$'
      - '^[0-9]+ supported chains$'

  - protocol: near
    slug: intents-docs-index
    url: https://docs.near-intents.org/llms.txt
    mode: text
    tags: [intents, docs-index, api]

  - protocol: near
    slug: intents-home
    url: https://docs.near-intents.org/
    tags: [intents, api, sdk]
    
repositories:
  # HPL — product, risk, SDK and deployment-adjacent code.
  - protocol: hpl
    slug: hyperlend-core
    repo: hyperlendx/hyperlend-core
    tags: [core, lending, contracts]
  - protocol: hpl
    slug: hyperlend-sdk-ts
    repo: hyperlendx/hyperlend-sdk-ts
    tags: [sdk, api]
  - protocol: hpl
    slug: hyperlend-isolated
    repo: hyperlendx/hyperlend-isolated
    tags: [isolated-pools, collateral]
  - protocol: hpl
    slug: hyperevm-oracle
    repo: hyperlendx/hyperevm-oracle
    tags: [oracle, risk]
  - protocol: hpl
    slug: looping-contracts
    repo: hyperlendx/looping-contracts
    tags: [loops, capital-efficiency]
  - protocol: hpl
    slug: audits
    repo: hyperlendx/audits
    tags: [audits, release-readiness]

  # NEAR — Intents and Chain Signatures / MPC surfaces most likely to reveal private HL signing.
  - protocol: near
    slug: intents
    repo: near/intents
    tags: [intents, api, contracts]
  - protocol: near
    slug: mpc
    repo: near/mpc
    tags: [mpc, chain-signatures, signing]
  - protocol: near
    slug: chainsig-lib
    repo: near/chainsig-lib
    tags: [chain-signatures, signing]
  - protocol: near
    slug: intents-examples
    repo: near-examples/near-intents-examples
    tags: [intents, examples, integration]
