name: Hourly protocol snapshots

on:
  workflow_dispatch:
  schedule:
    # Off the top of the hour to reduce GitHub Actions scheduling congestion.
    - cron: '17 * * * *'

permissions:
  contents: write

concurrency:
  group: protocol-snapshots
  cancel-in-progress: false

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out archive
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Snapshot watched pages and repo heads
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python monitor/snapshot.py

      - name: Commit only meaningful content changes
        shell: bash
        run: |
          if git diff --quiet -- snapshots/; then
            echo "No normalized documentation changes."
            exit 0
          fi
          git config user.name "protocol-watch[bot]"
          git config user.email "protocol-watch[bot]@users.noreply.github.com"
          git add snapshots/
          git commit -m "snapshot: $(date -u +%FT%H:%MZ) protocol changes"
          git push
